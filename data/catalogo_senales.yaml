    categoria: preventiva
    significado: "Reduzca la velocidad: la vía gira bruscamente hacia la izquierda."
    gtsrb: ["Dangerous curve left"]
    clip: "a yellow diamond road sign with a sharp left curve arrow"
  - id: curva_derecha
    nombre: "Curva peligrosa a la derecha"
    categoria: preventiva
    significado: "Reduzca la velocidad: la vía gira bruscamente hacia la derecha."
    gtsrb: ["Dangerous curve right"]
    clip: "a yellow diamond road sign with a sharp right curve arrow"
  - id: curva_y_contracurva
    nombre: "Curva y contracurva"
    categoria: preventiva
    significado: "Reduzca la velocidad: vienen dos curvas seguidas en sentidos contrarios."
    gtsrb: ["Double curve"]
    clip: "a yellow diamond road sign with an S-shaped winding road arrow"
  - id: resalto
    nombre: "Resalto o reductor de velocidad"
    categoria: preventiva
    significado: "Reduzca la velocidad: hay un resalto adelante."
    clip: "a yellow diamond road sign with a speed bump symbol"
  - id: via_resbaladiza
    nombre: "Vía resbaladiza"
    categoria: preventiva
    significado: "Reduzca la velocidad y evite frenar bruscamente: el pavimento puede estar resbaloso."
    gtsrb: ["Slippery road"]
    clip: "a yellow diamond road sign with a car skidding symbol, slippery road"
  - id: estrechamiento_derecha
    nombre: "Estrechamiento de la vía por la derecha"
    categoria: preventiva
    significado: "Prepárese para circular con menos ancho: la calzada se reduce por el lado derecho."
    gtsrb: ["Road narrows on the right"]
    clip: "a yellow diamond road sign showing the road narrowing on the right side"
  - id: trabajos_via
    nombre: "Trabajos en la vía"
    categoria: preventiva
    significado: "Disminuya la velocidad y esté atento: hay obras o personal trabajando en la vía."
    gtsrb: ["Road work"]
    clip: "a yellow diamond road sign with a person digging, road work"
  - id: semaforo
    nombre: "Semáforo adelante"
    categoria: preventiva
    significado: "Prepárese para detenerse: hay un semáforo más adelante."
    gtsrb: ["Traffic signals"]
    clip: "a yellow diamond road sign with a traffic light symbol"
  - id: peatones
    nombre: "Cruce de peatones"
    categoria: preventiva
    significado: "Reduzca la velocidad y esté atento: es posible que haya peatones cruzando la vía."
    gtsrb: ["Pedestrians"]
    clip: "a yellow diamond road sign with a walking pedestrian symbol"
  - id: zona_escolar
    nombre: "Zona escolar"
    categoria: preventiva
    significado: "Conduzca con precaución: hay una escuela cerca y pueden cruzar niños."
    gtsrb: ["Children crossing"]
    clip: "a yellow diamond road sign with two children walking, school zone"
  - id: ciclistas
    nombre: "Cruce de ciclistas"
    categoria: preventiva
    significado: "Reduzca la velocidad: pueden cruzar ciclistas la vía."
    gtsrb: ["Bicycles crossing"]
    clip: "a yellow diamond road sign with a bicycle symbol"
  - id: animales_silvestres
    nombre: "Paso de animales silvestres"
    categoria: preventiva
    significado: "Conduzca con cuidado: pueden cruzar animales silvestres la vía."
    gtsrb: ["Wild animals crossing"]
    clip: "a yellow diamond road sign with a wild animal symbol"
  - id: interseccion
    nombre: "Intersección"
    categoria: preventiva
    significado: "Reduzca la velocidad y observe: se aproxima un cruce con otra vía."
