# Catálogo de señales de tránsito colombianas (Manual de Señalización Vial 2015).
# Editable sin programar. Una etiqueta GTSRB solo se mapea si el significado es el mismo;
# ante la duda va en gtsrb_sin_equivalente (el sistema recurre a CLIP).
no_reconocida: "Señal no reconocida"
clip_otro: "a photo of something that is not a traffic sign"
categorias:
  reglamentaria:
    nombre: "Señal reglamentaria (tipo no identificado)"
    significado: "Señal que indica una obligación, restricción o prohibición para el conductor."
    clip: "a white circular road sign with red border"
  preventiva:
    nombre: "Señal preventiva (tipo no identificado)"
    significado: "Señal que advierte de un peligro o una condición especial de la vía."
    clip: "a yellow diamond-shaped warning road sign"
  informativa:
    nombre: "Señal informativa (tipo no identificado)"
    significado: "Señal que entrega al conductor información de ubicación, destinos o servicios."
    clip: "a blue rectangular informational road sign"
# Clases GTSRB sin equivalente colombiano claro. Priority road es un rombo amarillo y se
# confundiría con cualquier preventiva colombiana; las "End of ..." no existen en Colombia.
gtsrb_sin_equivalente:
  - "End of speed limit (80km/h)"
  - "No passing veh over 3.5 tons"
  - "Right-of-way at intersection"
  - "Priority road"
  - "No vehicles"
  - "Veh > 3.5 tons prohibited"
  - "General caution"
  - "Bumpy road"
  - "Beware of ice/snow"
  - "End speed + passing limits"
  - "Turn right ahead"
  - "Turn left ahead"
  - "Ahead only"
  - "Go straight or right"
  - "Go straight or left"
  - "Keep right"
  - "Keep left"
  - "Roundabout mandatory"
  - "End of no passing"
  - "End no passing veh > 3.5 tons"
senales:
  - id: pare
    nombre: "PARE"
    categoria: reglamentaria
    significado: "Detenga por completo el vehículo y avance solo cuando pueda hacerlo con seguridad, cediendo el paso a quien circula por la vía."
    gtsrb: ["Stop"]
    clip: "a red octagonal stop sign"
  - id: ceda_el_paso
    nombre: "CEDA EL PASO"
    categoria: reglamentaria
    significado: "Reduzca la velocidad y deje pasar a los vehículos de la otra vía antes de continuar."
    gtsrb: ["Yield"]
    clip: "a downward pointing triangular yield sign with red border"
  - id: velocidad_20
    nombre: "Velocidad máxima 20 km/h"
    categoria: reglamentaria
    significado: "No circule a más de 20 kilómetros por hora en este tramo."
    gtsrb: ["Speed limit (20km/h)"]
    clip: "a circular speed limit road sign showing the number 20"
    velocidad_kmh: 20
